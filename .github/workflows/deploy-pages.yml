name: Build and verify ASHES OF CROWNS

on:
  push:
    branches: [main]
    paths:
      - "ashes-of-crowns/**"
      - ".github/workflows/deploy-pages.yml"
      - ".github/workflows/rebuild-v2.yml"
  pull_request:
    branches: [main]
    paths:
      - "ashes-of-crowns/**"
      - ".github/workflows/deploy-pages.yml"
      - ".github/workflows/rebuild-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aoc-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ashes-of-crowns
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ashes-of-crowns/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Production build
        run: npm run build
      - name: Core and module tests
        run: npm run test:core
      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: ashes-of-crowns-dist
          path: ashes-of-crowns/dist
          if-no-files-found: error
          retention-days: 7
